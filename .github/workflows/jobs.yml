# Hourly job-board refresh: fetch all boards into src/data/jobs.json,
# rebuild the site from that snapshot, and deploy to Cloudflare.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN   — token with Workers Scripts:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
name: Refresh job board

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-job-board
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refuses to write an empty snapshot if every board fails (network
      # blip), so a bad run can't wipe the job board.
      - run: pnpm sync-jobs

      - run: pnpm build

      - run: pnpm dlx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
