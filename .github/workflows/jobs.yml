# Daily job-board refresh.
#
# Fetches all boards into src/data/jobs.json and pushes the updated
# snapshot to main. Deployment happens automatically via Cloudflare
# Workers Builds (Git integration) watching main — no Cloudflare API
# token needed here.
#
# One-time setup in Cloudflare dashboard:
#   Workers & Pages → nimbus-temp → Settings → Build → Connect to Git
#   Build command:  pnpm build
#   Deploy command: npx wrangler deploy
name: Refresh job board

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-job-board
  cancel-in-progress: true

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Refuses to write an empty snapshot if every board fails (network
      # blip), so a bad run can't wipe the job board.
      - run: pnpm sync-jobs

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/jobs.json
          if git diff --cached --quiet; then
            echo "No job changes since last snapshot — skipping commit."
          else
            git commit -m "chore(jobs): refresh board snapshot ($(date -u '+%Y-%m-%dT%H:%MZ'))"
            git push
          fi
